[package]
name = "gitnotes"
version = "0.1.0"
description = "Local-first notes for Markdown, Typst, and Git-backed vaults"
authors = ["Anton Chio"]
edition = "2021"

[lib]
name = "gitnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
notify = "8.2.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.4", features = [] }
tauri-plugin-dialog = "2.4.1"
tempfile = "3.23.0"
typst = "=0.14.2"
typst-as-lib = { version = "=0.15.5", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-assets = { version = "=0.14.2", features = ["fonts"] }
typst-svg = "=0.14.2"
walkdir = "2.5.0"
