<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitNotes</title>
    <script>
      // Apply the saved theme before first paint so the window does not flash
      // the default light theme (and a half-themed shell) on every launch.
      try {
        var gnPrefs = JSON.parse(localStorage.getItem("gitnotes.prefs.v1") || "{}");
        if (["light", "dark", "oled"].includes(gnPrefs.theme)) {
          document.documentElement.dataset.theme = gnPrefs.theme;
        }
        if (["mono", "sans", "serif"].includes(gnPrefs.font)) {
          document.documentElement.dataset.font = gnPrefs.font;
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
